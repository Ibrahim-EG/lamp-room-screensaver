name: Build Lamp Room APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract HTML from lamp_room.py (no computer needed!)
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          src = Path('lamp_room.py').read_text(encoding='utf-8')
          m = re.search(r'PAGE = r"""(.*?)"""', src, re.S)
          if not m:
              raise SystemExit('ERROR: PAGE not found inside lamp_room.py')
          Path('app/src/main/assets').mkdir(parents=True, exist_ok=True)
          Path('app/src/main/assets/index.html').write_text(m.group(1), encoding='utf-8')
          print('Extracted', len(m.group(1)), 'characters of HTML')
          PYEOF

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LampRoom-Screensaver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
